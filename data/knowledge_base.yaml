[
  {"id":"KB-01","title":"Password Reset","text":"Employees can reset their own password via the self-service portal at any time. If locked out after 5 failed attempts, contact IT to unlock the account manually. No approval required.","aliases":["password","locked out","unlock"]},
  {"id":"KB-02","title":"VPN Access","text":"VPN access is automatic for full-time employees. Contractors require manager approval submitted via the access request form. VPN credentials expire every 90 days and the employee renews them.","aliases":["vpn","remote access","credential"]},
  {"id":"KB-03","title":"Laptop Replacement","text":"Laptops are eligible for replacement after 3 years of service, or earlier for verified hardware failure. Requests must be raised at least 2 weeks before intended replacement.","aliases":["laptop","replacement","hardware failure"]},
  {"id":"KB-04","title":"Software Installation Requests","text":"Standard software in the approved catalog can be self-installed. Non-catalog software requires IT Security review, which takes 3-5 business days.","aliases":["software","extension","install","catalog"]},
  {"id":"KB-05","title":"Printer Troubleshooting","text":"For printer issues, first check the printer queue and restart the print spooler. If the issue persists after restart, log a ticket with the printer asset tag.","aliases":["printer","paper jam","spooler"]},
  {"id":"KB-06","title":"Email Mailbox Quota","text":"Default quota is 25GB. Employees nearing quota should archive old mail. Increases beyond 25GB require manager approval and are capped at 50GB.","aliases":["mailbox","quota","email full"]},
  {"id":"KB-07","title":"Guest Wi-Fi Access","text":"Guest Wi-Fi credentials are valid for 24 hours and can be generated by any employee from the front-desk kiosk. No IT ticket is required.","aliases":["guest","wifi","wi-fi"]},
  {"id":"KB-08","title":"Expense Software Access","text":"Finance, not IT, grants access to the expense management tool. IT only assists with login or technical issues once an account already exists.","aliases":["expense","finance tool","credentials"]},
  {"id":"KB-09","title":"Security Incident Reporting","text":"Report suspected phishing email, malware, or unauthorized access immediately to security@veridian-corp.example and do not forward it to other employees.","aliases":["phishing","malware","unauthorized"]},
  {"id":"KB-10","title":"Work-From-Home Equipment","text":"Employees remote more than 3 days each week qualify for a one-time home office allowance. Manager sign-off and Finance processing are required. IT ships equipment only after approval.","aliases":["work from home","monitor","home office"]},
  {"id":"ASSET-POLICY","title":"Finance and Assets refresh policy","text":"All company-issued hardware follows a standard 4-year refresh cycle from issue. Early replacement needs Finance sign-off in addition to IT approval.","aliases":["asset","four year","refresh","finance"]}
]
